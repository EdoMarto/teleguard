<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="360" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <text x="28" y="34" font-size="15" font-weight="bold" fill="#0f172a">On join</text>
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="28"  y="48" width="150" height="58" rx="10"/>
    <rect x="214" y="48" width="196" height="58" rx="10"/>
    <rect x="446" y="48" width="150" height="58" rx="10"/>
  </g>
  <rect x="686" y="24" width="150" height="48" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="686" y="92" width="150" height="48" rx="10" fill="#fee2e2" stroke="#dc2626"/>

  <g fill="#1f2937" font-size="13.5" text-anchor="middle">
    <text x="103" y="82">New member joins</text>
    <text x="312" y="72">Mute + risk score</text>
    <text x="312" y="90" font-size="11.5" fill="#64748b">photo? username? name? DC</text>
    <text x="521" y="72">CAPTCHA</text>
    <text x="521" y="90" font-size="11.5" fill="#64748b">harder if risky</text>
    <text x="761" y="52" fill="#166534">✅ Unmute + welcome</text>
    <text x="761" y="120" fill="#991b1b">❌ Kick (solved? no / timeout)</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="178" y1="77" x2="208" y2="77" marker-end="url(#a)"/>
    <line x1="410" y1="77" x2="440" y2="77" marker-end="url(#a)"/>
    <path d="M596,66 C640,55 650,50 680,48" stroke="#16a34a" marker-end="url(#g)"/>
    <path d="M596,90 C640,104 650,112 680,116" stroke="#dc2626" marker-end="url(#r)"/>
  </g>

  <line x1="28" y1="176" x2="932" y2="176" stroke="#e5e7eb"/>

  <text x="28" y="212" font-size="15" font-weight="bold" fill="#0f172a">On every message</text>
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="28"  y="228" width="150" height="58" rx="10"/>
    <rect x="214" y="228" width="196" height="58" rx="10"/>
  </g>
  <rect x="446" y="206" width="170" height="48" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="446" y="272" width="200" height="48" rx="10" fill="#fee2e2" stroke="#dc2626"/>

  <g fill="#1f2937" font-size="13.5" text-anchor="middle">
    <text x="103" y="262">Message</text>
    <text x="312" y="252">Anti-flood +</text>
    <text x="312" y="270">spam filter</text>
    <text x="531" y="234" fill="#166534">✅ Allowed</text>
    <text x="546" y="300" fill="#991b1b">❌ Delete + warn → ban</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="178" y1="257" x2="208" y2="257" marker-end="url(#a)"/>
    <path d="M410,246 C432,236 436,232 440,230" stroke="#16a34a" marker-end="url(#g)"/>
    <path d="M410,268 C432,284 436,292 440,296" stroke="#dc2626" marker-end="url(#r)"/>
  </g>
